<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>System admin · Africa MICE Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pipeline/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
.hidden{display:none!important}
/* ---------- sign-in ---------- */
#authView{min-height:100vh;display:flex;flex-direction:column}
.authBar{max-width:1152px;width:100%;margin:0 auto;height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
.authBar a.txt{font-size:14px;font-weight:500;color:var(--muted)}
.authMain{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px 72px}
.authCard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px;width:min(420px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.authCard h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:12px 0 6px}
.authCard p.sub{color:var(--muted);margin-bottom:24px;font-size:14px}
/* ---------- shell ---------- */
/* Left sidebar on wide screens; a top bar with a scrolling row of sections below 900px. */
#appView{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:236px;flex:none;z-index:50;background:rgba(11,18,32,.96);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 12px;overflow-y:auto}
.side .wordmark{padding:4px 10px}
.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
.tabs button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:10px;color:var(--muted);padding:10px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.tabs button.active{color:var(--ink);background:rgba(25,195,177,.12);box-shadow:inset 3px 0 0 var(--accent)}
.tabs .badge{display:inline-block;background:var(--accent);color:var(--navy);border-radius:999px;font-size:10.5px;font-weight:800;padding:1px 7px}
.who{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 10px 0;border-top:1px solid var(--line)}
.who #whoEmail{overflow-wrap:anywhere;margin-bottom:2px}
.who button{background:none;border:none;padding:0;color:var(--muted);font-size:12.5px;text-decoration:underline}
.who button:hover{color:var(--ink)}
main{flex:1;min-width:0;min-height:100vh;padding:28px 32px 72px}
@media(max-width:900px){
  #appView{flex-direction:column}
  .side{height:auto;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-right:none;border-bottom:1px solid var(--line);overflow:visible}
  .side .wordmark{padding:0}
  .tabs{flex-direction:row;flex:1 1 100%;order:3;overflow-x:auto}
  .tabs button{width:auto;padding:8px 12px}
  .tabs .badge{margin-left:6px}
  .who{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-left:auto;padding:0;border-top:none}
  main{min-height:0;padding:24px 16px 56px}
  .side{position:sticky;top:0}
}
main .inner{max-width:1320px;margin:0 auto}
.pageHead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pageHead h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.pageHead p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:720px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:8px 10px;font-size:13px}
/* ---------- content ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kpi .l{font-size:10.5px;font-weight:600;color:var(--faint);margin-top:6px;text-transform:uppercase;letter-spacing:.14em}
.kpi.alert .n{color:var(--red)}
.kpi.warnk .n{color:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px;overflow-x:auto}
.card h3{font-size:15px;margin-bottom:12px}
.card p.note{color:var(--muted);font-size:13px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .sub{color:var(--muted);font-size:12px}
td.acts{white-space:nowrap;text-align:right}
td.acts .btn{margin-left:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.empty{color:var(--muted);padding:26px 10px;text-align:center}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--t-n);color:var(--muted)}
.chip.good{background:var(--t-accent);color:var(--accent2)}
.chip.warnc{background:var(--t-amber);color:var(--amber)}
.chip.bad{background:var(--t-red);color:var(--red)}
.chip.info{background:var(--t-sky);color:var(--sky)}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}
.bars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.diff{font-size:12px;color:var(--muted);max-width:520px;word-break:break-word}
.diff b{color:var(--ink);font-weight:600}
/* ---------- modal and toast ---------- */
#modalBack{position:fixed;inset:0;background:rgba(5,9,18,.72);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(560px,100%);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.modal .mHead{background:var(--panel2);padding:18px 22px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.modal .mHead h3{font-size:18px;font-weight:800}
.modal .mHead button{background:none;border:none;color:var(--muted);font-size:16px}
.modal .mBody{padding:20px 22px}
.modal .mBody p{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.pwBox{background:var(--t-accent);border:1px solid rgba(25,195,177,.3);border-radius:10px;padding:14px;margin:12px 0;font-size:13px}
.pwBox code{font-size:15px;font-weight:700;padding:3px 8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid var(--line2);color:#eef1f6;padding:11px 18px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 20px 50px rgba(0,0,0,.45)}
@media(max-width:640px){.grid2{grid-template-columns:1fr}main{padding:20px 14px 56px}}
</style>
</head>
<body>

<div id="authView">
  <div class="authBar">
    <a class="wordmark" href="/" aria-label="Africa MICE Dashboard home"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="23" rx="6" fill="#121A2B" stroke="rgba(255,255,255,0.12)"/><g fill="#19C3B1"><circle cx="7" cy="7" r="1.6"/><circle cx="12" cy="7" r="1.6" opacity=".4"/><circle cx="17" cy="7" r="1.6" opacity=".4"/><circle cx="7" cy="12" r="1.6" opacity=".4"/><circle cx="12" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6" opacity=".4"/><circle cx="12" cy="17" r="1.6" opacity=".4"/><circle cx="17" cy="17" r="1.6"/></g></svg><b>Africa MICE Dashboard</b></a>
    <a class="txt" href="/pipeline">Back to the pipeline</a>
  </div>
  <div class="authMain">
    <div class="authCard hidden" id="authFirst"></div>
    <div class="authCard" id="authSignin">
      <span class="overline">System admin</span>
      <h1>Sign in</h1>
      <p class="sub">For the agency team only. Bureau logins do not work here.</p>
      <div id="authErr" class="err hidden" style="margin:0 0 14px"></div>
      <div class="field"><label for="inEmail">Email</label><input type="email" id="inEmail" autocomplete="username"></div>
      <div class="field"><label for="inPass">Password</label><input type="password" id="inPass" autocomplete="current-password"></div>
      <button class="btn primary" id="btnLogin">Sign in</button>
    </div>
  </div>
</div>

<div id="appView" class="hidden">
  <aside class="side">
    <a class="wordmark" href="/pipeline" aria-label="Back to the pipeline"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="23" rx="6" fill="#121A2B" stroke="rgba(255,255,255,0.12)"/><g fill="#19C3B1"><circle cx="7" cy="7" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="17" cy="17" r="1.6"/></g></svg><b>System admin</b></a>
    <nav class="tabs" id="navTabs" aria-label="Admin sections"></nav>
    <div class="who"><span id="whoEmail"></span><button id="btnPw">Change password</button><button id="btnOut">Sign out</button></div>
  </aside>
  <main class="light"><div class="inner" id="mainEl"></div></main>
</div>
<div id="modalBack" class="hidden light"><div class="modal" id="modalEl" role="dialog" aria-modal="true"></div></div>

<script>
const SUPABASE_URL = "https://upzkvszgoqhoefkiwoep.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwemt2c3pnb3Fob2Vma2l3b2VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzg1MjQsImV4cCI6MjA5NzcxNDUyNH0.4RB-5FCWW7JXvGBKs0PlzkYcUeG5kTVxTVdoXUNp8ao";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => t ? new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const day = t => t ? new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "";
const ago = t => { if(!t) return "never"; const s=(Date.now()-new Date(t))/1000; if(s<90) return "just now"; if(s<5400) return Math.round(s/60)+" min ago"; if(s<129600) return Math.round(s/3600)+" h ago"; return Math.round(s/86400)+" days ago"; };
const words = s => String(s||"").replace(/_/g," ");
const label = s => { const w = words(s); return w.charAt(0).toUpperCase() + w.slice(1); };
const chip = (t,c="") => `<span class="chip ${c}">${esc(words(t))}</span>`;
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3600); }
function showModal(title, body){ $("#modalEl").innerHTML=`<div class="mHead"><h3>${esc(title)}</h3><button onclick="closeModal()" aria-label="Close">✕</button></div><div class="mBody">${body}</div>`; $("#modalBack").classList.remove("hidden"); }
window.closeModal = ()=> $("#modalBack").classList.add("hidden");
const table = (heads, rows, emptyMsg) => rows.length
  ? `<table><thead><tr>${heads.map(h=>`<th${/^#/.test(h)?' class="num"':""}>${esc(h.replace(/^#/,""))}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`
  : `<div class="empty">${esc(emptyMsg||"Nothing to show.")}</div>`;

async function rpc(name, args){
  const {data,error} = await sb.rpc(name, args||{});
  if(error){ toast(error.message); throw error; }
  return data;
}
// Account actions that change a sign-in go through the bureau-admin function.
async function accountAction(payload){
  const {data:{session}} = await sb.auth.getSession();
  const res = await fetch(SUPABASE_URL+"/functions/v1/bureau-admin", {method:"POST",
    headers:{"content-type":"application/json", apikey:SUPABASE_KEY, Authorization:"Bearer "+session.access_token}, body:JSON.stringify(payload)});
  const out = await res.json().catch(()=>({error:"Unexpected response"}));
  if(!res.ok || out.error){ toast(out.error||"The action failed."); throw new Error(out.error); }
  return out;
}
function showPassword(title, out){
  showModal(title, `<p>Send these details to the user through a private channel. The password is shown once and cannot be retrieved later.</p>
    <div class="pwBox">Email <code>${esc(out.email)}</code><br><br>Temporary password <code>${esc(out.temp_password)}</code>${out.expires_at?`<br><br>Valid until ${esc(day(out.expires_at))}. The user must choose a new password at first sign-in.`:""}</div>
    <button class="btn primary" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(out.temp_password))}).then(()=>toast('Password copied'))">Copy password</button>`);
}

let ME = null, VIEW = "overview", LOOKUPS = null;
const TABS = [["overview","Overview"],["signups","Signups"],["accounts","Accounts"],["reports","Reports"],["activity","Activity"],["logs","Logs"],["audit","Audit log"],["limits","Rate limits"],["legal","Legal"],["team","Team"]];
const isSuper = ()=> ME && ME.level==="super";

/* ---------- sign-in ---------- */
function authErr(m){ const el=$("#authErr"); el.textContent=m; el.classList.remove("hidden"); }
let LAST_PW = null; // the temporary password just typed, so first sign-in can refuse it as the new one
$("#btnLogin").onclick = async ()=>{
  const {data,error} = await sb.auth.signInWithPassword({email:$("#inEmail").value.trim(), password:$("#inPass").value});
  if(error) return authErr(error.message==="Invalid login credentials" ? "Invalid email or password." : error.message);
  LAST_PW = $("#inPass").value; $("#inPass").value = "";
  enter(data.session);
};
$("#inPass").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#btnLogin").click(); });
async function enter(session){
  const {data,error} = await sb.rpc("admin_lookups");
  if(error){
    // A staff login on a temporary password has no access until first sign-in is done.
    const {data:st} = await sb.rpc("staff_signin_state");
    if(st && st.must_change_password) return staffFirstSignin(session, st);
    await sb.auth.signOut(); return authErr("This account has no access to the admin console.");
  }
  LAST_PW = null; $("#authFirst").classList.add("hidden"); $("#authSignin").classList.remove("hidden");
  ME = data; LOOKUPS = data;
  $("#authView").classList.add("hidden"); $("#appView").classList.remove("hidden");
  $("#whoEmail").textContent = session.user.email + (isSuper() ? " · super admin" : " · staff");
  buildNav(); render();
}
/* Staff first sign-in (migration admin_console_gaps): confirm the email with a
   one-time code, then replace the temporary password. Until
   staff_complete_first_signin() accepts both, admin_level() gives no access. */
const STAFF_PW_RULES = [
  [p=>p.length>=12, "At least 12 characters"],
  [p=>/[a-z]/.test(p) && /[A-Z]/.test(p), "Upper and lower case letters"],
  [p=>/\d/.test(p), "At least one number"],
  [p=>/[^A-Za-z0-9]/.test(p), "At least one symbol"],
];
const PW_COMMON = ["password","passw0rd","qwerty","letmein","welcome","admin","123456","africa","mice","bureau","pipeline"];
function staffFirstSignin(session, st){
  const email = session.user.email, box = $("#authFirst");
  $("#authSignin").classList.add("hidden"); box.classList.remove("hidden");
  const err = m => { const el=$("#fsErr"); if(!el) return; el.textContent=m||""; el.classList.toggle("hidden",!m); };
  const wireOut = ()=>{ $("#fsOut").onclick = async ev=>{ ev.preventDefault(); await sb.auth.signOut({scope:"local"}); location.reload(); }; };
  if(st.expired){
    box.innerHTML = `<span class="overline">First sign-in</span><h1>Temporary password expired</h1>
      <p class="sub">Temporary passwords last seven days. Ask a super admin to reset yours.</p>
      <p class="sub"><a href="#" id="fsOut">Back to sign in</a></p>`;
    return wireOut();
  }
  const claims = (()=>{ try{ return JSON.parse(atob(session.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))); }catch(_){ return {}; } })();
  const hasCode = (claims.amr||[]).some(a=>a.method==="otp" || a.method==="magiclink");

  const stepCode = msg => {
    box.innerHTML = `<span class="overline">First sign-in · step 1 of 2</span><h1>Confirm your email</h1>
      <p class="sub">For your security we will email a one-time code to <b>${esc(email)}</b>.</p>
      <div id="fsErr" class="err hidden" style="margin:0 0 14px"></div>
      <button class="btn primary" id="fsSend">Email me a code</button>
      <div id="fsCodeWrap" class="hidden">
        <p class="sub" style="margin:14px 0">Code sent. It is valid for a limited time and can be used once.</p>
        <div class="field"><label for="fsCode">Code from the email</label><input id="fsCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></div>
        <button class="btn primary" id="fsVerify">Confirm code</button>
        <p class="sub" style="margin-top:14px">Nothing after a few minutes? Check your spam folder, then <a href="#" id="fsResend">send a new code</a>.</p>
      </div>
      <p class="sub" style="margin-top:18px"><a href="#" id="fsOut">Sign out</a></p>`;
    wireOut(); err(msg);
    let sentAt = 0, tries = 0;
    const send = async ()=>{
      const wait = Math.ceil((sentAt+60000-Date.now())/1000);
      if(wait>0) return err(`You can ask for another code in ${wait} seconds.`);
      err(""); $("#fsSend").disabled = true;
      const {error} = await sb.auth.signInWithOtp({email, options:{shouldCreateUser:false, emailRedirectTo:location.origin+"/admin"}});
      $("#fsSend").disabled = false;
      if(error) return err(error.message);
      sentAt = Date.now(); tries = 0;
      $("#fsSend").classList.add("hidden"); $("#fsCodeWrap").classList.remove("hidden"); $("#fsCode").focus();
    };
    const verify = async ()=>{
      const token = $("#fsCode").value.replace(/\s+/g,"");
      if(!/^\d{6,10}$/.test(token)) return err("Enter the code exactly as it appears in the email.");
      if(++tries>5) return err("Too many wrong codes. Send a new code and try again.");
      err(""); $("#fsVerify").disabled = true;
      const {data, error} = await sb.auth.verifyOtp({email, token, type:"email"});
      $("#fsVerify").disabled = false;
      if(error || !data?.session) return err("That code is wrong or has expired. Request a new one.");
      stepPassword();
    };
    $("#fsSend").onclick = send;
    $("#fsResend").onclick = ev=>{ ev.preventDefault(); send(); };
    $("#fsVerify").onclick = verify;
    $("#fsCode").addEventListener("keydown",e=>{ if(e.key==="Enter") verify(); });
  };

  const stepPassword = ()=>{
    box.innerHTML = `<span class="overline">First sign-in · step 2 of 2</span><h1>Choose your password</h1>
      <p class="sub">Replace the temporary password with one only you know. Use at least 12 characters, with upper and lower case letters, a number and a symbol.</p>
      <div id="fsErr" class="err hidden" style="margin:0 0 14px"></div>
      <div class="field"><label for="fsPw1">New password</label><input type="password" id="fsPw1" autocomplete="new-password" maxlength="72"></div>
      <div class="field"><label for="fsPw2">Repeat new password</label><input type="password" id="fsPw2" autocomplete="new-password" maxlength="72"></div>
      <button class="btn primary" id="fsSave">Save and continue</button>
      <p class="sub" style="margin-top:18px"><a href="#" id="fsOut">Sign out</a></p>`;
    wireOut(); $("#fsPw1").focus();
    $("#fsSave").onclick = async ()=>{
      const p = $("#fsPw1").value, low = p.toLowerCase();
      const probs = STAFF_PW_RULES.filter(([t])=>!t(p)).map(([,l])=>l.toLowerCase());
      if(PW_COMMON.some(w=>low.includes(w))) probs.push("no common words such as password, admin or africa");
      if(LAST_PW && p===LAST_PW) probs.push("something other than the temporary password");
      if(probs.length) return err("The password needs "+probs.join(", ")+".");
      if(p!==$("#fsPw2").value) return err("The two passwords do not match.");
      err(""); $("#fsSave").disabled = true;
      const {error} = await sb.auth.updateUser({password:p});
      if(error){ $("#fsSave").disabled = false; return err(error.message); }
      const {error:e2} = await sb.rpc("staff_complete_first_signin");
      if(e2){ $("#fsSave").disabled = false; return /confirm your email/i.test(e2.message) ? stepCode(e2.message) : err(e2.message); }
      await sb.auth.signOut({scope:"others"});
      const {data:{session:s}} = await sb.auth.getSession();
      enter(s);
    };
  };
  hasCode ? stepPassword() : stepCode();
}
$("#btnOut").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };
$("#btnPw").onclick = ()=> showModal("Change password", `<div class="field"><label for="pw1">New password (at least 12 characters)</label><input type="password" id="pw1" autocomplete="new-password"></div>
  <div class="field"><label for="pw2">Repeat new password</label><input type="password" id="pw2" autocomplete="new-password"></div>
  <button class="btn primary" onclick="savePw()">Update password</button>`);
window.savePw = async ()=>{
  const p=$("#pw1").value; if(p.length<12) return toast("Use at least 12 characters."); if(p!==$("#pw2").value) return toast("The passwords do not match.");
  const {error} = await sb.auth.updateUser({password:p}); if(error) return toast(error.message);
  closeModal(); toast("Password updated.");
};
sb.auth.getSession().then(({data})=>{ if(data.session) enter(data.session); });

function buildNav(badges){
  const b = badges||{};
  $("#navTabs").innerHTML = TABS.filter(([k])=> k!=="team" || isSuper()).map(([k,l])=>

function diffText(a){
  const o=a.old_row, n=a.new_row;
  if(a.summary) return esc(a.summary);
  if(o && n) return Object.keys(n).filter(k=>JSON.stringify(o[k])!==JSON.stringify(n[k])).map(k=>`<b>${esc(words(k))}</b> ${esc(JSON.stringify(o[k]))} to ${esc(JSON.stringify(n[k]))}`).join("; ");
  const r=n||o; if(!r) return "";
  return (n?"Added ":"Removed ")+esc(Object.entries(r).filter(([,v])=>v!==null&&typeof v!=="object").slice(0,6).map(([k,v])=>words(k)+" "+v).join(", "));
}

      <td>${a.accepted_at ? esc(when(a.accepted_at)) : (a.accepted_version ? "Asked again at next sign-in" : "–")}</td></tr>`), "No bureau logins yet.")}</div>
  <div class="card"><h3>Acceptance history</h3>${table(["When","Login","Organisation","Version"], ta.history.map(h=>`<tr><td style="white-space:nowrap">${esc(when(h.accepted_at))}</td><td>${esc(h.email||"")}</td><td>${esc(h.org_name||"")}</td><td>${esc(h.version)}</td></tr>`), "Nobody has accepted the terms yet.")}</div>
  <div class="card"><h3>Published legal text</h3>${table(["Document","Version","Review","Published","By",""], docs.map((d,i)=>`<tr>
      <td><b>${esc(DOC_L[d.doc_type]||d.doc_type)}</b><div class="sub">${esc(d.title)}</div></td><td>${esc(d.version)}</td>
      <td>${d.review_status==="approved"?chip("approved","good"):chip("draft for legal review","warnc")}</td><td>${esc(day(d.published_at))}</td><td>${esc(d.created_by||"")}</td>
      <td class="acts"><button class="btn ghost sm" onclick="lgView(${i})">Read</button> <a class="btn ghost sm" href="/legal?doc=${esc(d.doc_type)}" target="_blank" rel="noopener">Public page</a></td></tr>`))}
    <p class="note">The text uses {owner}, filled in from legal.config.json. A new Terms of Access version asks every bureau to accept again at their next sign-in.</p></div>`;
}
window.lgView = i => { const d = LD[i];
  showModal(`${DOC_L[d.doc_type]||d.doc_type}, version ${d.version}`, `<pre style="white-space:pre-wrap;font-family:inherit;font-size:13px">${esc(d.body)}</pre>${d.accept_label?`<p class="note">Checkbox: ${esc(d.accept_label)}</p>`:""}`); };
window.lgPublish = () => {
  const latest = t => LD.find(d=>d.doc_type===t) || {};
  showModal("Publish a new version", `<div class="field"><label for="lgT">Document</label><select id="lgT">${Object.entries(DOC_L).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select></div>
    <div class="field"><label for="lgN">Title</label><input id="lgN"></div>
    <div class="field"><label for="lgB">Text (blank lines separate paragraphs; lines starting "1." form a list; {owner} is replaced)</label><textarea id="lgB" style="min-height:220px"></textarea></div>
    <div class="field"><label for="lgA">Checkbox label (licence and terms only)</label><input id="lgA"></div>
    <div class="field"><label for="lgR">Review</label><select id="lgR"><option value="draft_for_review">Draft for legal review</option><option value="approved">Approved by the IP practitioner</option></select></div>
    <button class="btn primary" id="lgGo">Publish</button>`);
  const fill = ()=>{ const d = latest($("#lgT").value); $("#lgN").value = d.title||""; $("#lgB").value = d.body||""; $("#lgA").value = d.accept_label||""; };
  fill(); $("#lgT").onchange = fill;
  $("#lgGo").onclick = async ()=>{
    if(!confirm("Publish this as a new version? It goes live at once"+($("#lgT").value==="terms_of_access"?" and every bureau must accept it again.":"."))) return;
    const r = await rpc("admin_legal_publish", {p_type:$("#lgT").value, p_title:$("#lgN").value, p_body:$("#lgB").value, p_accept_label:$("#lgA").value||null, p_review_status:$("#lgR").value});
    closeModal(); toast("Version "+r.version+" published."); render(); };
};

/* ---------- rate limits ---------- */
const span = s => s%86400===0 ? (s/86400)+(s===86400?" day":" days") : s%3600===0 ? (s/3600)+(s===3600?" hour":" hours") : s%60===0 ? (s/60)+" minutes" : s+" seconds";
let RL = null;
async function rLimits(){
  RL = await rpc("admin_rate_limits");
  $("#mainEl").innerHTML = head("Rate limits", "Each rule caps how often one user, email or network can do something. Sign-in attempts are limited separately by the authentication service.")
  + `<div class="card"><h3>Rules</h3>${table(["Rule","Limit","#Hits this window","#Blocks in 24 hours","Status",""], RL.rules.map(r=>`<tr>
      <td><b>${esc(r.description)}</b><div class="sub mono">${esc(r.key)}</div></td><td>${r.max_hits} per ${esc(span(r.window_seconds))}</td>
      <td class="num">${r.hits_now}</td><td class="num">${r.blocks_24h?chip(r.blocks_24h,"warnc"):0}</td><td>${r.enabled?chip("on","good"):chip("off","bad")}</td>
      <td class="acts">${isSuper()?`<button class="btn ghost sm" onclick="rlEdit('${r.key}')">Change</button>`:""}</td></tr>`))}</div>
  <div class="card"><h3>Blocked right now</h3>${table(["Who","Rule","#Attempts","Blocked until",""], RL.blocked_now.map((b,i)=>`<tr>
      <td>${esc(b.label)}</td><td class="mono">${esc(b.rule)}</td><td class="num">${b.hits} of ${b.max_hits}</td><td>${esc(when(b.until))}</td>
      <td class="acts">${isSuper()?`<button class="btn ghost sm" onclick="rlClear(${i})">Lift block</button>`:""}</td></tr>`), "Nobody is blocked at the moment.")}</div>
  <div class="card"><h3>Retention</h3>${table(["Setting","#Days",""], RL.settings.map(s=>`<tr><td>${esc(s.description)}</td><td class="num">${esc(s.value)}</td>
      <td class="acts">${isSuper()?`<button class="btn ghost sm" onclick="setEdit('${s.key}',${Number(s.value)})">Change</button>`:""}</td></tr>`))}<p class="note" style="margin-top:12px">The audit log is kept indefinitely.</p></div>`;
}
window.rlEdit = key => { const r = RL.rules.find(x=>x.key===key);
  showModal("Change rule", `<p>${esc(r.description)}</p>
    <div class="field"><label for="rlM">Maximum attempts</label><input type="number" id="rlM" min="1" value="${r.max_hits}"></div>
    <div class="field"><label for="rlW">Window in seconds</label><input type="number" id="rlW" min="10" value="${r.window_seconds}"><div class="hint">3600 is one hour and 86400 is one day.</div></div>
    <div class="field"><label for="rlE">Status</label><select id="rlE"><option value="true" ${r.enabled?"selected":""}>On</option><option value="false" ${r.enabled?"":"selected"}>Off</option></select></div>
    <button class="btn primary" id="rlGo">Save rule</button>`);
  $("#rlGo").onclick = async ()=>{ await rpc("admin_rate_limit_set", {p_key:key, patch:{max_hits:Number($("#rlM").value), window_seconds:Number($("#rlW").value), enabled:$("#rlE").value==="true"}});
    closeModal(); toast("Rule saved."); render(); };
};
window.rlClear = async i => { const b = RL.blocked_now[i]; await rpc("admin_rate_limit_clear", {p_rule:b.rule, p_subject:b.subject}); toast("Block lifted."); render(); };
window.setEdit = async (key, cur) => { const v = prompt("Number of days (7 to 3650)", cur); if(v===null) return;
  await rpc("admin_setting_set", {p_key:key, p_value:Number(v)}); toast("Setting saved."); render(); };

/* ---------- team ---------- */
async function rTeam(){
  const t = await rpc("admin_team");
  $("#mainEl").innerHTML = head("Team", "Staff can review signups and reports, suspend accounts, reset passwords and read every screen here. Only super admins change tiers, rules, settings and the team.",
    `<button class="btn sm" onclick="stAdd()">Add staff member</button>`)
  + `<div class="card"><h3>Staff</h3>${table(["Staff member","Status","Last sign-in","Added by",""], t.staff.map(s=>`<tr>
      <td><b>${esc(s.full_name||s.email)}</b><div class="sub">${esc(s.email)}</div></td>
      <td>${s.active?chip("active","good"):chip("disabled","bad")}${s.has_login?(s.must_change_password?" "+chip("awaiting first sign-in","warnc"):""):" "+chip("no login yet","warnc")}</td><td>${esc(ago(s.last_sign_in_at))}</td><td>${esc(s.added_by||"")}</td>
      <td class="acts">${s.has_login?`<button class="btn ghost sm" onclick="stLogin('${esc(s.email)}','reset_staff_password')">Reset password</button>`:`<button class="btn sm" onclick="stLogin('${esc(s.email)}','create_staff')">Create login</button>`}
        <button class="btn ghost sm" onclick="stSet('${esc(s.email)}',${!s.active})">${s.active?"Disable":"Enable"}</button><button class="btn danger sm" onclick="stRemove('${esc(s.email)}')">Remove</button></td></tr>`), "No staff yet. Add a team member to share the queues.")}</div>
  <div class="card"><h3>Super admins</h3><p class="note">Super admins are managed directly in the database for safety. Ask your developer to add or remove one.</p>${table(["Email","Last sign-in"], t.super.map(a=>`<tr><td>${esc(a.email)}</td><td>${esc(ago(a.last_sign_in_at))}</td></tr>`))}</div>`;
}
window.stAdd = () => { showModal("Add staff member", `<div class="field"><label for="stE">Work email</label><input type="email" id="stE"></div>
    <div class="field"><label for="stN">Full name</label><input id="stN"></div><button class="btn primary" id="stGo">Add and create login</button>`);
  $("#stGo").onclick = async ()=>{ const r = await rpc("admin_staff_set", {p_email:$("#stE").value, p_full_name:$("#stN").value, p_active:true});
    try{ showPassword("Staff login created", await accountAction({action:"create_staff", email:r.email})); }catch(_){ closeModal(); } render(); };
};
window.stLogin = async (email, action) => { showPassword(action==="create_staff"?"Staff login created":"Temporary password issued", await accountAction({action, email})); render(); };
window.stSet = async (email, active) => { await rpc("admin_staff_set", {p_email:email, p_active:active}); toast(active?"Staff member enabled.":"Staff member disabled."); render(); };
// Removing goes through bureau-admin so the staff member's login is deleted too.
window.stRemove = async email => { if(!confirm("Remove "+email+" from staff? Their access ends at once and their login is deleted.")) return;
  try{ await accountAction({action:"remove_staff", email}); toast("Staff member removed."); }catch(_){} render(); };
</script>
</body>
</html>
