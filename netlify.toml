[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The Bid Pipeline is a standalone static page (public/pipeline/), outside the
# React landing page. This rule must stay above the SPA catch-all.
[[redirects]]
  from = "/pipeline"
  to = "/pipeline/index.html"
  status = 200

# Destination partner submission form (no login), also the verify link and status page.
[[redirects]]
  from = "/pipeline/partner"
  to = "/pipeline/partner.html"
  status = 200

# System admin console (sign-in required, agency team only), public/admin/.
# Rewritten so /admin loads without a redirect to /admin/.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Public event submission form (no login), linked from the landing page.
[[redirects]]
  from = "/pipeline/submit"
  to = "/pipeline/submit.html"
  status = 200

# Legal pages (public): /legal?doc=... shows a published legal_documents version,
# /legal/rights is the correction and removal request form.
[[redirects]]
  from = "/legal"
  to = "/legal/index.html"
  status = 200

[[redirects]]
  from = "/legal/rights"
  to = "/legal/rights.html"
  status = 200

# Any other /pipeline address (for example the old /pipeline/admin) is a 404,
# not the landing page. Files that exist, such as theme.css, still load.
[[redirects]]
  from = "/pipeline/*"
  to = "/pipeline/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The pipeline holds confidential data behind sign-in: keep it out of search
# engines and out of shared caches.
[[headers]]
  for = "/pipeline/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
