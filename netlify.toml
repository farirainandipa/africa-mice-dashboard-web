[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The Bid Pipeline is a standalone static page (public/pipeline/), outside the
# React landing page. This rule must stay above the SPA catch-all.
[[redirects]]
  from = "/pipeline"
  to = "/pipeline/index.html"
  status = 200

# Public bid-history teaser (no login): last three hosts per series.
[[redirects]]
  from = "/pipeline/history"
  to = "/pipeline/history.html"
  status = 200

# Destination partner submission form (no login), also the verify link and status page.
[[redirects]]
  from = "/pipeline/partner"
  to = "/pipeline/partner.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The pipeline holds confidential data behind sign-in: keep it out of search
# engines and out of shared caches.
[[headers]]
  for = "/pipeline/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
